# Configuración entorno de staging (validación pre-producción)
environment: staging
mlflow:
  tracking_uri: https://mlflow.staging.internal
  registry_uri: https://mlflow.staging.internal
feature_store:
  repo_path: ./features_repo
  online_store: redis://redis.staging.internal:6379
serving:
  host: 0.0.0.0
  port: 8000
  timeout_ms: 200
models:
  riesgo-financiero:
    version: 2.1.0
    threshold: 0.40
  fraude-anomalias:
    version: 1.4.2
    threshold: 0.70
monitoring:
  drift_psi_threshold: 0.20
  latency_p95_ms: 100
